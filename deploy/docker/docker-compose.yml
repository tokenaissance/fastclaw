##
## FastAgent — single-machine deployment with Postgres.
##
## Quick start:
##   docker compose up -d
##   open http://localhost:18953        # walks the onboard wizard:
##                                       # super-admin account + first
##                                       # provider + first agent
##
## Or initialize from CLI without opening the web UI:
##   docker compose exec fastagent fastagent admin create-user \
##     --username alice --email alice@example.com --password 'hunter2' \
##     --role super_admin
##
## All runtime config goes through FASTAGENT_* env vars — no config file.
##
services:
  fastagent:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/fastclaw-ai/fastclaw:latest
    restart: unless-stopped
    ports:
      - "${FASTAGENT_PORT:-18953}:18953"
    volumes:
      - fastagent-data:/data/.fastagent
    environment:
      # Server default timezone (IANA name). This is the LAST fallback in
      # the chain chatter pref → agent default → system default → TZ —
      # without it the container runs UTC and agents whose chatters never
      # set a timezone get UTC wall clocks and UTC-fired schedules.
      TZ: "${TZ:-Asia/Shanghai}"
      # FASTAGENT_HOME — sqlite db path + sandbox root + skill cache live here
      FASTAGENT_HOME: /data/.fastagent
      # Bind to all interfaces so the host port mapping works
      FASTAGENT_BIND: all
      FASTAGENT_PORT: "18953"
      # Postgres backend (sqlite would also work; use it by clearing
      # these two and removing the postgres service below)
      FASTAGENT_STORAGE_TYPE: postgres
      FASTAGENT_STORAGE_DSN: "postgres://fastagent:${POSTGRES_PASSWORD:-fastagent-secret}@postgres:5432/fastagent?sslmode=disable"
      FASTAGENT_STORAGE_AUTO_MIGRATE: "true"
      # Sandbox (optional; uncomment to enable)
      # FASTAGENT_SANDBOX_ENABLED: "true"
      # FASTAGENT_SANDBOX_BACKEND: docker
      # FASTAGENT_SANDBOX_IMAGE: python:3.12-slim
    depends_on:
      postgres:
        condition: service_healthy
    command: ["gateway"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastagent
      POSTGRES_USER: fastagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastagent-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastagent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  fastagent-data:
  postgres-data:
