apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastagent.fullname" . }}-secrets
  labels:
    {{- include "fastagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  STORAGE_DSN: {{ include "fastagent.dsn" . | quote }}
  {{- if and (ne .Values.objectStore.type "local") .Values.objectStore.accessKey }}
  OBJECT_STORE_ACCESSKEY: {{ .Values.objectStore.accessKey | quote }}
  OBJECT_STORE_SECRETKEY: {{ .Values.objectStore.secretKey | quote }}
  {{- end }}
  {{- if and .Values.sandbox.enabled .Values.sandbox.e2bApiKey }}
  E2B_API_KEY: {{ .Values.sandbox.e2bApiKey | quote }}
  {{- end }}
  {{- if .Values.webhook.token }}
  FASTAGENT_WEBHOOK_TOKEN: {{ .Values.webhook.token | quote }}
  {{- end }}
  {{- if .Values.oauth.secret }}
  FASTAGENT_OAUTH_SECRET: {{ .Values.oauth.secret | quote }}
  {{- end }}
